<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — Meepo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
  }
  .card-glow {
    background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.06), transparent 40%);
  }
</style>
</head>
<body class="bg-black text-neutral-200 min-h-screen">

  <nav class="border-b border-neutral-800 bg-neutral-950/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center">
          <span class="text-black font-extrabold text-sm">M</span>
        </div>
        <span class="text-white font-semibold text-lg tracking-tight">Meepo</span>
      </div>
      <div class="hidden md:flex items-center gap-8 text-sm text-neutral-400">
        <a href="#" class="text-white font-medium">Tasks</a>
        <a href="#" class="hover:text-white transition-colors">Leaderboard</a>
        <a href="#" class="hover:text-white transition-colors">Progress</a>
        <a href="#" class="hover:text-white transition-colors">Profile</a>
      </div>
      <button class="rounded-lg bg-white text-black text-sm font-semibold px-4 py-2 hover:bg-neutral-200 transition-colors">
        New Task
      </button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-12">
    <div class="mb-10 flex flex-col md:flex-row md:items-end md:justify-between gap-6">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Your Tasks</h1>
        <p class="text-neutral-500 mt-2 text-sm md:text-base">Pick a subject and sharpen your problem-solving skills.</p>
      </div>
      <div class="flex items-center gap-3">
        <button class="rounded-lg border border-neutral-800 bg-neutral-950 text-neutral-300 text-sm font-medium px-4 py-2 hover:border-neutral-700 hover:text-white transition-colors">
          All Subjects
        </button>
        <button class="rounded-lg border border-neutral-800 bg-neutral-950 text-neutral-300 text-sm font-medium px-4 py-2 hover:border-neutral-700 hover:text-white transition-colors">
          Difficulty
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

      {% for task in tasks %}
      <div class="group relative rounded-2xl border border-neutral-800 bg-neutral-950 p-6 transition-all duration-300 hover:border-neutral-700 hover:-translate-y-1 hover:shadow-2xl hover:shadow-black/50">
        <div class="flex items-start justify-between mb-6">
          <span class="text-xs font-semibold uppercase tracking-wider text-{{ task.color }}-400 bg-{{ task.color }}-500/10 border border-{{ task.color }}-500/20 rounded-full px-3 py-1">
            {{ task.subject }}
          </span>
          <span class="text-xs font-medium text-neutral-500">Task #{{ task.id }}</span>
        </div>
        <h3 class="text-lg font-semibold text-white mb-2">{{ task.title }}</h3>
        <p class="text-sm text-neutral-500 mb-6 leading-relaxed">
          {{ task.description }}
        </p>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-{{ task.dot_color }}-500"></span>
            <span class="text-xs text-neutral-500">{{ task.difficulty }}</span>
          </div>
          <button class="text-sm font-medium text-white flex items-center gap-1 group-hover:gap-2 transition-all">
            Start
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
      {% endfor %}

    </div>
  </main>

</body>
</html>
